name: Update app catalog
on:
  schedule:
    - cron: '17 2 * * *'   # every day 08:17 Bangladesh time
  workflow_dispatch:
  push:
    paths: ['overrides.json', 'scripts/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build.mjs
      - name: Commit if changed
        run: |
          git config user.name "gvw-catalog-bot"
          git config user.email "mail@munayem.com"
          git add apps.json
          git diff --cached --quiet || (git commit -m "Update apps.json" && git push)
